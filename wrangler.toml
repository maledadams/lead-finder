name = "lead-finder"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["0 5 * * *", "0 6 * * *", "0 7 * * *", "0 11 * * *"]

[[routes]]
pattern = "leads.maledadams.work"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "lead-finder"
database_id = "e8410da3-3981-428c-ba18-d5995825811e"

[ai]
binding = "AI"

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

[vars]
DAILY_FETCH_BUDGET = "900"
DAILY_AI_BUDGET = "75"
DAILY_QUEUE_MAX = "30"
CRAWL_FRONTIER_BATCH = "90"
MAX_RUN_SECONDS = "120"
NO_SITE_BATCH = "40"
DAILY_BROWSER_RENDERS = "30"
DAILY_SOURCE_QUERIES = "24"
KEYWORDS_VALIDATED_PER_RUN = "8"
SOURCE_KEYWORDS_PER_RUN = "5"
SOURCE_METROS_PER_RUN = "4"
FRONTIER_LOW_WATER = "150"
MIN_SCORE_TO_QUEUE = "68"
ABSOLUTE_FLOOR = "35"
SKIP_COOLDOWN_DAYS = "45"
MIN_PRESCORE_FOR_AI = "45"
RE_EVAL_AFTER_DAYS = "45"
REQUIRE_ACCESS = "true"

# Secrets set with `wrangler secret put`:
# ALLOWED_EMAILS, CF_ACCOUNT_ID, SENDER_NAME, SENDER_EMAIL,
# SENDER_POSTAL_ADDRESS, DASHBOARD_KEY, SESSION_SECRET, ZOHO_CLIENT_SECRET

ZOHO_CLIENT_ID = "1000.TZQ2SZONKI7N9111083IQA2ZS9WVEC"
ZOHO_REGION = "com"
DAILY_SEND_CAP = "30"
USER_AGENT = "LeadFinderBot/0.1 (+https://example.com; hello@example.com)"

[observability]
enabled = true
