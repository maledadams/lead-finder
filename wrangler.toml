name = "lead-finder"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Cron schedule.
#
# Two triggers, deliberately few — every invocation costs requests and CPU.
#
#   05:00 UTC  crawl   three passes rather than one: a single invocation
#   06:00 UTC  crawl   cannot work through a day's budget before it runs out
#   07:00 UTC  crawl   of time, and shorter runs also fail more cheaply.
#   11:00 UTC  queue   build the day's ranked outreach queue (<=30)
#
# The gap lets the crawl finish and settle before the queue reads scores.
# Adjust to taste; more frequent runs cost more and buy nothing at this volume.
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 5 * * *", "0 6 * * *", "0 7 * * *", "0 11 * * *"]

# ---------------------------------------------------------------------------
# Custom domain for the dashboard.
#
# Internal tooling lives on the work domain; the client-facing identity is
# lucia-adams.com. Cloudflare Access can only protect a hostname in a zone you
# control, which is why this is not on workers.dev.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "leads.maledadams.work"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "lead-finder"
# Replace with the id printed by `npm run db:create`.
database_id = "YOUR_D1_DATABASE_ID"

[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Rate limiting.
#
# Two separate limiters on purpose. A wrong key is the signal that matters —
# someone guessing gets throttled hard and independently of normal use, so a
# brute-force attempt cannot hide inside ordinary dashboard traffic.
# Counters are per-colo, not global; that is fine for abuse control.
# ---------------------------------------------------------------------------
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

[vars]
# Everything here is a safety limit. They are intentionally low.
# Raise them only after you have watched real usage in the dashboard.
DAILY_FETCH_BUDGET = "900"
DAILY_AI_BUDGET = "75"
DAILY_QUEUE_MAX = "30"
CRAWL_FRONTIER_BATCH = "90"
# A pass stops cleanly at this many seconds; the next cron pass continues.
MAX_RUN_SECONDS = "120"
NO_SITE_BATCH = "40"
# Browser Rendering is metered. Only JS-rendered pages escalate to it.
DAILY_BROWSER_RENDERS = "30"
CF_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
DAILY_SOURCE_QUERIES = "24"
KEYWORDS_VALIDATED_PER_RUN = "8"
SOURCE_KEYWORDS_PER_RUN = "5"
SOURCE_METROS_PER_RUN = "4"
FRONTIER_LOW_WATER = "150"
MIN_SCORE_TO_QUEUE = "68"      # the recommended line, not a hard gate
ABSOLUTE_FLOOR = "35"          # below this a lead is genuinely not worth a look
MIN_PRESCORE_FOR_AI = "45"
RE_EVAL_AFTER_DAYS = "45"
# Set to "true" once the Worker is behind Cloudflare Access on a custom
# domain. It then refuses any request that did not come through Access,
# which closes the workers.dev bypass.
REQUIRE_ACCESS = "false"

# Google sign-in. Everyone here gets their own login and their decisions are
# recorded under their own address. GOOGLE_CLIENT_SECRET and SESSION_SECRET
# are secrets, not vars — set them with `wrangler secret put`.
GOOGLE_CLIENT_ID = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID"
ALLOWED_EMAILS = "owner@example.com,teammate@example.com"
USER_AGENT = "LeadFinderBot/0.1 (+https://lucia-adams.com; hello@example.com)"

# Sending identity, used in outreach drafts and the CAN-SPAM footer.
# These are placeholders — fill them in before you send anything.
SENDER_NAME = "Lucía Adams"
SENDER_EMAIL = "hello@example.com"
SENDER_POSTAL_ADDRESS = "REPLACE — CAN-SPAM requires a real physical mailing address"

# Set a long random string, then send it as `Authorization: Bearer <value>`
# (or `?key=<value>`) to reach the dashboard and the seed endpoint.
# Use a secret in production:  wrangler secret put DASHBOARD_KEY
[observability]
enabled = true
